# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 10c124ff-49de-460c-b030-1abd6e4a79c9

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "citibike_dev"
  dev_flag:
    default: true
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405606152698986.6.azuredatabricks.net
      
    variables:
      catalog:
      schema: dev
  test:
    mode: production
    workspace:
      host: https://adb-7405610573064188.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/tariq.faisal1999@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "citibike_test"
      dev_flag:
        default: false
      schema: prod
    permissions:
      - user_name: tariq.faisal1999@outlook.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://adb-7405611661497602.2.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/tariq.faisal1999@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "citibike_prod"
      dev_flag:
        default: false
      schema: prod
    permissions:
      - user_name: tariq.faisal1999@outlook.com
        level: CAN_MANAGE
